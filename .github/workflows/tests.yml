name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install medimg with development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests (including adjoint and golden-output tests)
        run: pytest

      # The examples must work from any directory, so run them from outside
      # the repository in quick mode.
      - name: Run the examples (quick mode)
        if: matrix.python-version == '3.13'
        working-directory: ${{ runner.temp }}
        env:
          MPLBACKEND: Agg
        run: |
          python "$GITHUB_WORKSPACE/examples/01_mri_cs.py" --quick --outdir "$RUNNER_TEMP/figures"
          python "$GITHUB_WORKSPACE/examples/02_ct_sparse_view.py" --quick --outdir "$RUNNER_TEMP/figures"
